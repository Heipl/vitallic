<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  <marker id="a2s" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M10,0 L0,5 L10,10 z" fill="#333"/></marker>
  <pattern id="soil" width="9" height="9" patternUnits="userSpaceOnUse">
    <rect width="9" height="9" fill="#efe7da"/><circle cx="4" cy="4" r="0.9" fill="#cdbfa8"/>
  </pattern>
  <style>
    .t  { font-size:19px; font-weight:700; fill:#111 }
    .sub{ font-size:12px; fill:#555 }
    .zh { font-size:11px; font-weight:700; fill:#666; letter-spacing:1.3px }
    .bt { font-size:13px; font-weight:700; fill:#111 }
    .bs { font-size:11.5px; fill:#333 }
    .dim{ font-size:11px; fill:#1b6ec2; font-weight:700 }
    .warn{font-size:11.5px; fill:#c0392b; font-weight:600 }
    .m  { font-size:10.5px; fill:#666; font-style:italic }
    .box{ fill:#fff; stroke:#bbb; stroke-width:1.5; rx:7 }
    .zone{fill:#fafafa; stroke:#ddd; stroke-width:1.5; rx:10 }
  </style>
</defs>
<rect width="1280" height="900" fill="#fff"/>

<text x="40" y="42" class="t">Vitallic — sensor mounting (WITH the robot dog)</text>
<text x="40" y="64" class="sub">No wiring to the dog. The phones are self-contained sensors on a non-metal boom; everything reaches the laptop over Wi-Fi.</text>

<!-- ================= SIDE ELEVATION ================= -->
<rect x="36" y="86" width="740" height="420" class="zone"/>
<text x="52" y="110" class="zh">SIDE ELEVATION — to scale</text>

<!-- ground -->
<rect x="60" y="400" width="700" height="80" fill="url(#soil)" stroke="#c9b99f"/>
<line x1="60" y1="400" x2="760" y2="400" stroke="#8a7b63" stroke-width="2.5"/>
<text x="690" y="420" class="m">ground</text>

<!-- dog body -->
<rect x="560" y="286" width="170" height="70" rx="12" fill="#e8ecf1" stroke="#7d8896" stroke-width="2"/>
<text x="600" y="318" class="bt">Unitree Go2</text>
<text x="608" y="336" class="bs">body centre</text>
<line x1="645" y1="356" x2="645" y2="400" stroke="#7d8896" stroke-width="7" stroke-linecap="round"/>
<line x1="700" y1="356" x2="706" y2="400" stroke="#7d8896" stroke-width="7" stroke-linecap="round"/>
<line x1="585" y1="356" x2="578" y2="400" stroke="#7d8896" stroke-width="7" stroke-linecap="round"/>
<!-- body centre marker -->
<line x1="645" y1="270" x2="645" y2="400" stroke="#1b6ec2" stroke-dasharray="4 4" stroke-width="1.3"/>
<text x="600" y="264" class="dim">body centre</text>

<!-- boom -->
<line x1="645" y1="330" x2="190" y2="330" stroke="#a9772f" stroke-width="9" stroke-linecap="round"/>
<text x="330" y="322" class="bt">non-metal boom (wood / PVC)</text>

<!-- HIGH phone -->
<rect x="150" y="310" width="78" height="40" rx="5" fill="#dceaf7" stroke="#2f6ca8" stroke-width="2"/>
<text x="163" y="335" class="bt">HIGH</text>
<line x1="189" y1="350" x2="189" y2="400" stroke="#1b6ec2" stroke-dasharray="3 3" stroke-width="1.2"/>

<!-- LOW phone (sled) -->
<rect x="150" y="372" width="78" height="26" rx="4" fill="#dceaf7" stroke="#2f6ca8" stroke-width="2"/>
<text x="166" y="390" class="bt">LOW</text>
<line x1="150" y1="398" x2="232" y2="398" stroke="#2f6ca8" stroke-width="3"/>
<text x="238" y="392" class="m">foam sled keeps height constant</text>

<!-- vertical dims -->
<line x1="120" y1="330" x2="120" y2="400" stroke="#1b6ec2" stroke-width="1.3" marker-start="url(#a2s)" marker-end="url(#a2)"/>
<text x="60" y="362" class="dim">0.35 m</text>
<text x="60" y="376" class="m">--h-high</text>
<line x1="266" y1="385" x2="266" y2="400" stroke="#1b6ec2" stroke-width="1.3" marker-start="url(#a2s)" marker-end="url(#a2)"/>
<text x="274" y="378" class="dim">0.05 m  --h-low</text>

<!-- horizontal boom dim -->
<line x1="189" y1="248" x2="645" y2="248" stroke="#1b6ec2" stroke-width="1.3" marker-start="url(#a2s)" marker-end="url(#a2)"/>
<text x="360" y="242" class="dim">0.65 m  (--boom)</text>
<text x="300" y="228" class="m">longer boom = less interference from the dog</text>

<!-- buried target -->
<ellipse cx="189" cy="443" rx="26" ry="11" fill="#b0453a" stroke="#7d2d25" stroke-width="1.5"/>
<text x="224" y="447" class="bs">buried steel</text>
<line x1="189" y1="400" x2="189" y2="432" stroke="#b0453a" stroke-dasharray="3 3" stroke-width="1.3"/>
<text x="120" y="470" class="m">the fit recovers this depth</text>

<text x="56" y="496" class="warn">Keep the rig non-magnetic: no metal fixings near the phones, no magnetic phone cases, keys out of your pockets.</text>

<!-- ================= TOP-DOWN SCAN ================= -->
<rect x="796" y="86" width="448" height="420" class="zone"/>
<text x="812" y="110" class="zh">TOP-DOWN — the cross scan at one flagged spot</text>

<!-- axes -->
<line x1="1020" y1="160" x2="1020" y2="440" stroke="#ccc" stroke-width="1"/>
<line x1="880" y1="300" x2="1160" y2="300" stroke="#ccc" stroke-width="1"/>
<text x="1026" y="156" class="m">+x forward</text>
<text x="884" y="292" class="m">+y left</text>

<!-- cross points: 9 along x, 9 along y, 5 cm apart -->
<g fill="#2f6ca8">
  <circle cx="1020" cy="160" r="5"/><circle cx="1020" cy="195" r="5"/><circle cx="1020" cy="230" r="5"/>
  <circle cx="1020" cy="265" r="5"/><circle cx="1020" cy="335" r="5"/>
  <circle cx="1020" cy="370" r="5"/><circle cx="1020" cy="405" r="5"/><circle cx="1020" cy="440" r="5"/>
  <circle cx="880" cy="300" r="5"/><circle cx="915" cy="300" r="5"/><circle cx="950" cy="300" r="5"/>
  <circle cx="985" cy="300" r="5"/><circle cx="1055" cy="300" r="5"/>
  <circle cx="1090" cy="300" r="5"/><circle cx="1125" cy="300" r="5"/><circle cx="1160" cy="300" r="5"/>
</g>
<circle cx="1020" cy="300" r="8" fill="#b0453a" stroke="#7d2d25" stroke-width="2"/>
<text x="1034" y="296" class="bs">flagged spot</text>

<line x1="1020" y1="470" x2="1055" y2="470" stroke="#1b6ec2" stroke-width="1.3" marker-start="url(#a2s)" marker-end="url(#a2)"/>
<text x="1062" y="474" class="dim">--step 0.05 m</text>

<text x="812" y="500" class="bs">17 points (2 × 9 − 1), 40 cm across. Each is one averaged reading from both phones.</text>

<!-- ================= NOTES ================= -->
<rect x="36" y="526" width="740" height="344" class="zone"/>
<text x="52" y="550" class="zh">BUILD NOTES</text>

<rect x="52" y="564" width="352" height="128" class="box"/>
<text x="66" y="584" class="bt">Phone orientation — get this right</text>
<text x="66" y="604" class="bs">Both phones FLAT, screen UP, with the TOP edge</text>
<text x="66" y="618" class="bs">pointing FORWARD along the boom.</text>
<text x="66" y="638" class="bs">phone_to_arena() assumes exactly this:</text>
<text x="66" y="654" class="bs" font-family="Consolas, monospace">  arena = [ y_phone, −x_phone, z_phone ]</text>
<text x="66" y="674" class="warn">Mount them differently and the fit's frame is wrong.</text>

<rect x="418" y="564" width="342" height="128" class="box"/>
<text x="432" y="584" class="bt">Keeping the phones alive</text>
<text x="432" y="604" class="bs">· Screen timeout → Never, on both.</text>
<text x="432" y="620" class="bs">· phyphox must stay in the FOREGROUND,</text>
<text x="432" y="634" class="bs">  with the Magnetometer experiment playing.</text>
<text x="432" y="650" class="bs">· Enable "Allow remote access" per experiment.</text>
<text x="432" y="670" class="warn">Backgrounding the app stops the server dead.</text>

<rect x="52" y="704" width="352" height="150" class="box"/>
<text x="66" y="724" class="bt">Network</text>
<text x="66" y="744" class="bs">Both phones AND the laptop on one network that</text>
<text x="66" y="758" class="bs">allows client-to-client traffic.</text>
<text x="66" y="778" class="warn">Phone hotspots often isolate clients: the laptop</text>
<text x="66" y="792" class="warn">can reach the hotspot HOST but not other clients.</text>
<text x="66" y="812" class="bs">Safest: host the hotspot from the laptop that runs</text>
<text x="66" y="826" class="bs">field_scan.py, so it is the hub and reaches both.</text>
<text x="66" y="846" class="m">Enterprise Wi-Fi (802.1X) cannot host the dog.</text>

<rect x="418" y="704" width="342" height="150" class="box"/>
<text x="432" y="724" class="bt">Two Androids beat Android + iPhone</text>
<text x="432" y="744" class="bs">A gradiometer wants matched sensors. Measured on</text>
<text x="432" y="758" class="bs">this rig: the Android held ~0.4 µT noise, while the</text>
<text x="432" y="772" class="bs">iPhone drifted several µT over ~10 s as iOS</text>
<text x="432" y="786" class="bs">auto-recalibrated its magnetometer.</text>
<text x="432" y="806" class="bs">A constant offset between phones is harmless — the</text>
<text x="432" y="820" class="bs">fit has a per-phone offset term. Time-varying drift</text>
<text x="432" y="834" class="warn">is NOT absorbed and will corrupt a long scan.</text>

<!-- ================= UNO Q ================= -->
<rect x="796" y="526" width="448" height="344" class="zone"/>
<text x="812" y="550" class="zh">OPTIONAL — UNO Q status display</text>

<rect x="812" y="564" width="416" height="118" class="box"/>
<text x="826" y="584" class="bt">No wiring at all</text>
<text x="826" y="604" class="bs">The UNO Q only needs USB-C power. Its Linux side</text>
<text x="826" y="618" class="bs">polls the laptop over Wi-Fi and calls the STM32</text>
<text x="826" y="632" class="bs">sketch over the internal Bridge — no GPIO, no</text>
<text x="826" y="646" class="bs">sensors, nothing connected to the dog.</text>
<text x="826" y="668" class="m">arduino/dog/status_display.ino + _linux.py</text>

<rect x="812" y="694" width="416" height="76" class="box"/>
<text x="826" y="714" class="bt">Data path</text>
<text x="826" y="734" class="bs" font-family="Consolas, monospace">GET :8765/state → Bridge.call("show", code)</text>
<text x="826" y="752" class="bs">→ 8×13 LED matrix draws the current verdict</text>

<rect x="812" y="782" width="416" height="76" class="box"/>
<text x="826" y="802" class="bt">What it shows</text>
<text x="826" y="822" class="bs">sweeping bar = scanning · flashing X = MINE_SIZED</text>
<text x="826" y="838" class="bs">tick = fragment · "?" = rescan · dim dash = clear</text>
<text x="826" y="854" class="m">Unreachable laptop falls back to idle.</text>
</svg>
